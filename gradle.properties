org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Keep the user's 4-core laptop usable while Gradle runs: low OS priority, fewer parallel workers and a capped
# Kotlin daemon (it would otherwise inherit its own default heap on top of Gradle's).
org.gradle.priority=low
org.gradle.workers.max=3
kotlin.daemon.jvmargs=-Xmx1g
